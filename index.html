<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINNER | Private Virtual Tour</title><style>
:root{--gold:#d9b77d;--glass:rgba(12,9,14,.84)}*{box-sizing:border-box}body{margin:0;background:#070608;color:#f7ecdc;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}button{cursor:pointer;color:inherit;font:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}#view{position:fixed;inset:0;overflow:hidden}#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s ease,transform 1.5s ease}#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#050306b0,transparent 26%,transparent 60%,#050306bd)}#top{position:absolute;z-index:4;top:0;left:0;right:0;padding:20px 26px;display:flex;justify-content:space-between;align-items:start;gap:15px}#brand{font:25px Georgia,serif;letter-spacing:.25em;color:var(--gold);text-shadow:0 2px 8px black}#brand small{display:block;font:9px system-ui;letter-spacing:.4em;text-align:center;margin-top:6px}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}.glass{border:1px solid #b18b5688;background:var(--glass);backdrop-filter:blur(14px);padding:11px 13px;border-radius:10px}.glass:hover,.choice:hover,.room:hover{background:#513b2c;border-color:#ebcb96}#bottom{position:absolute;bottom:17px;left:20px;right:20px;z-index:4;display:flex;align-items:end;justify-content:space-between;gap:12px}#location{background:var(--glass);border-left:2px solid var(--gold);padding:12px 16px;max-width:65%}#location strong{color:var(--gold)}#count{display:block;font-size:12px;color:#cabdae;margin-top:4px}#nav{display:flex;gap:8px}#hotspots{position:absolute;inset:0;z-index:3;pointer-events:none}.hotspot{position:absolute;pointer-events:auto;border:1px solid #d8b980aa;border-radius:25px;background:#0a0709b8;backdrop-filter:blur(9px);padding:11px 16px;color:#f5dfb6;box-shadow:0 8px 24px #0008}.hotspot:hover{background:#634529c9}.hotspot:disabled{display:none}#left{left:5%;top:49%}#right{right:5%;top:49%}#door{left:50%;bottom:24%;transform:translateX(-50%)}#panel{position:fixed;right:0;top:0;bottom:0;z-index:15;width:min(430px,100vw);padding:24px;background:#100d12f7;border-left:1px solid #b69565;overflow-y:auto;transform:translateX(105%);transition:transform .35s}#panel.open{transform:translateX(0)}.heading{display:flex;justify-content:space-between;align-items:center;color:var(--gold)}.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.floor{padding:17px 5px;border:1px solid #8f714c;background:#221b1e}.floor.active{background:#745333}.floor:disabled{opacity:.25;cursor:not-allowed}#rooms{display:grid;gap:8px}.room{text-align:left;background:#1e181c;border:1px solid #5f5041;padding:14px;border-radius:5px}.room small{display:block;color:#c7b4a2;margin-top:5px}#veil{position:fixed;inset:0;z-index:20;background:#050406;opacity:0;pointer-events:none;transition:opacity 1.1s ease}#veil.on{opacity:1;pointer-events:auto}#travel{position:fixed;z-index:21;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;pointer-events:none;color:#d9b77d;letter-spacing:.2em;text-shadow:0 0 25px #aa8658}#travel.show{display:flex}#travel .small{font-size:11px;letter-spacing:.36em;color:#bda37d}#travel .big{font:30px Georgia,serif}#intro{position:fixed;z-index:30;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(140deg,#080609eb,#1c0e17dc),url('1F_001.webp') center/cover}#intro h1{font:normal clamp(48px,9vw,100px) Georgia,serif;color:var(--gold);letter-spacing:.24em;margin:0}#intro p{line-height:1.8;color:#e5cfb2}#enter{border:1px solid #e4be7b;background:#7c542b;padding:15px 35px;letter-spacing:.13em;margin-top:15px}#npcActor{position:fixed;z-index:6;bottom:0;left:7%;height:min(78vh,760px);max-width:42vw;object-fit:contain;object-position:bottom;cursor:pointer;filter:drop-shadow(0 15px 25px #000c);transition:opacity .45s,transform .5s;opacity:0;transform:translateY(30px);pointer-events:none}#npcActor.visible{opacity:1;transform:translateY(0);pointer-events:auto}#dialog{position:fixed;z-index:9;bottom:22px;left:13%;right:13%;min-height:142px;padding:20px 25px;background:#120c16f2;border:1px solid #a57d64;border-radius:11px;box-shadow:0 16px 70px #000c;display:none}#dialog.open{display:block}#speaker{color:#e4bb79;letter-spacing:.17em;font:15px Georgia,serif;margin-bottom:12px}#dialogText{line-height:1.75;min-height:46px}#dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.choice{background:#39212c;border:1px solid #946d64;border-radius:6px;padding:8px 17px}#settings{position:fixed;z-index:12;right:18px;top:85px;display:none;background:#171017f2;padding:16px;border:1px solid #a88a61;border-radius:8px}#settings.open{display:block}input[type=range]{accent-color:var(--gold)}#toast{position:fixed;z-index:25;top:92px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#160f16e8;border:1px solid #b48b5a;border-radius:8px;display:none;font-size:13px}#note{color:#c3b3a1;font-size:12px;line-height:1.6}@media(max-width:650px){#top{padding:12px}#brand{font-size:17px}.glass{padding:9px;font-size:12px}#bottom{left:10px;right:10px;bottom:10px;flex-wrap:wrap}#location{max-width:100%;width:100%}#nav{margin-left:auto}#npcActor{left:-7%;height:66vh;max-width:75vw}#dialog{left:4%;right:4%;bottom:85px;min-height:155px;padding:14px}#hotspots .hotspot{font-size:12px;padding:8px 10px}#door{bottom:31%}#location{font-size:13px}}
</style></head><body><main id="view"><img id="scene" alt="SINNER 공간"><div id="shade"></div><div id="hotspots"><button id="left" class="hotspot" onclick="step(-1)">← 이전 시점</button><button id="right" class="hotspot" onclick="step(1)">다음 시점 →</button><button id="door" class="hotspot" onclick="advance()">✦ 다른 공간으로</button></div><header id="top"><div id="brand">SINNER<small>HOST CLUB</small></div><div class="controls"><button id="music" class="glass" onclick="toggleMusic()">♫ OFF</button><button class="glass" onclick="toggleSettings()">⚙</button><button class="glass" onclick="openPanel()">층 · 공간 ☰</button></div></header><img id="npcActor" src="npc_idle.png" alt="1층 리셉션 안내 직원" onclick="startNpc()"><section id="dialog" aria-live="polite"><div id="speaker">RECEPTION</div><div id="dialogText"></div><div id="dialogActions"><button class="choice" onclick="endNpc()">닫기</button><button id="nextDialogue" class="choice" onclick="nextNpc()">다음 ›</button></div></section><footer id="bottom"><div id="location"><strong id="floorname">1F · MAIN LOBBY</strong> · <b id="roomname">1층 로비</b><span id="count">장면 준비 중</span></div><div id="nav"><button class="glass" onclick="startNpc()">안내 직원</button><button class="glass" onclick="openPanel()">층 선택</button></div></footer></main><aside id="panel"><div class="heading"><h2>FLOOR GUIDE</h2><button class="glass" onclick="closePanel()">✕</button></div><p>층과 공간을 선택하세요.</p><div class="floors" id="floors"></div><h3 style="color:var(--gold)">공간 선택</h3><div id="rooms"></div><p id="note">현재 91장의 배경 이미지를 사용합니다. 4층과 B1의 미완성 장면은 추후 추가할 수 있습니다. 시점 이동은 실제 3D가 아닌 사진 기반 탐색입니다.</p></aside><div id="settings">배경음악 볼륨 <input type="range" min="0" max="100" value="35" oninput="audio.volume=this.value/100"><p><label><input type="checkbox" id="effects" checked> 효과음</label></p></div><div id="veil"></div><div id="travel"><div class="small">SINNER PRIVATE LIFT</div><div id="travelFloor" class="big"></div><div class="small" id="travelStatus">이동 중</div></div><div id="toast"></div><section id="intro"><div><h1>SINNER</h1><p>HOST CLUB · PRIVATE VIRTUAL EXPERIENCE</p><p>공간을 탐색하고, 리셉션 직원의 안내를 받아보세요.</p><button id="enter" onclick="enter()">ENTER SINNER</button></div></section><audio id="audio" src="background.mp3" loop preload="metadata"></audio><script>
const $=id=>document.getElementById(id);let scenes=[],current=0,busy=false,npcStep=-1,shownWelcome=false,ctx=null;const audio=$('audio');audio.volume=.35;const floorOrder=['RF','7F','6F','5F','4F','3F','2F','1F','B1'];const floorNames={RF:'ROOFTOP','7F':'STAFF','6F':'MANAGEMENT','5F':'ROYAL SUITE','4F':'VVIP','3F':'VIP','2F':'PREMIUM LOUNGE','1F':'MAIN LOBBY',B1:'PARKING'};const delay=ms=>new Promise(r=>setTimeout(r,ms));
function tone(freq=660,duration=.1,vol=.035){if(!$('effects').checked)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration+.01)}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function enter(){$('intro').style.display='none';audio.play().then(updateMusic).catch(updateMusic);if(!shownWelcome){shownWelcome=true;setTimeout(()=>{if(scenes[current]?.floor==='1F')startNpc()},650)}}function updateMusic(){$('music').textContent=audio.paused?'♫ OFF':'♫ ON'}function toggleMusic(){if(audio.paused)audio.play().then(updateMusic).catch(updateMusic);else{audio.pause();updateMusic()}}function toggleSettings(){$('settings').classList.toggle('open')}
async function loadScene(index){const s=scenes[index];if(!s)return;const img=$('scene');img.style.opacity='0';const preload=new Image();preload.onload=()=>{img.src=preload.src;requestAnimationFrame(()=>{img.style.opacity='1'})};preload.onerror=()=>{img.style.opacity='1';toast('이미지를 불러오지 못했습니다: '+s.image)};preload.src=s.image;const subset=scenes.filter(x=>x.floor===s.floor&&x.group===s.group);$('floorname').textContent=s.floor+' · '+floorNames[s.floor];$('roomname').textContent=s.group;$('count').textContent=`${subset.findIndex(x=>x.id===s.id)+1} / ${subset.length} 시점 · ${scenes.filter(x=>x.floor===s.floor).length}장 · 전체 ${scenes.length}장`;$('left').disabled=s.prev===null||!scenes.some(x=>x.id===s.prev);$('right').disabled=s.next===null||!scenes.some(x=>x.id===s.next);$('npcActor').classList.toggle('visible',s.floor==='1F'&&$('intro').style.display==='none');if(s.floor!=='1F')endNpc(true)}
function indexById(id){return scenes.findIndex(s=>s.id===id)}function go(i){if(busy||i<0||i>=scenes.length)return;endNpc(true);tone(560);current=i;loadScene(current);closePanel();drawPanel()}function step(n){const s=scenes[current];go(indexById(n<0?s.prev:s.next))}function advance(){const s=scenes[current];const groups=[...new Set(scenes.filter(x=>x.floor===s.floor).map(x=>x.group))];let j=groups.indexOf(s.group);go(scenes.findIndex(x=>x.floor===s.floor&&x.group===groups[(j+1)%groups.length]))}
function openPanel(){tone(790);$('panel').classList.add('open');drawPanel()}function closePanel(){$('panel').classList.remove('open')}function drawPanel(){if(!scenes.length)return;const s=scenes[current];$('floors').replaceChildren();for(const f of floorOrder){const b=document.createElement('button');b.className='floor'+(s.floor===f?' active':'');b.textContent=f;b.disabled=!scenes.some(x=>x.floor===f);b.onclick=()=>ride(f);$('floors').append(b)}$('rooms').replaceChildren();for(const group of [...new Set(scenes.filter(x=>x.floor===s.floor).map(x=>x.group))]){const ss=scenes.filter(x=>x.floor===s.floor&&x.group===group);const b=document.createElement('button');b.className='room';b.textContent=group;const sm=document.createElement('small');sm.textContent=ss.length+'개 시점 · 입장';b.append(sm);b.onclick=()=>go(indexById(ss[0].id));$('rooms').append(b)}}
async function ride(f){if(busy)return;const target=scenes.findIndex(x=>x.floor===f);if(target<0)return;if(f===scenes[current].floor){closePanel();return}busy=true;closePanel();endNpc(true);tone(610,.12);$('veil').classList.add('on');await delay(1050);$('travelFloor').textContent=f+' · '+floorNames[f];$('travelStatus').textContent='이동 중';$('travel').classList.add('show');tone(155,.8,.012);await delay(1100);current=target;await loadScene(current);$('travelStatus').textContent='도착';tone(770,.19);await delay(180);tone(1020,.23);await delay(650);$('travel').classList.remove('show');$('veil').classList.remove('on');await delay(1100);busy=false;drawPanel()}
const dialogues=[{image:'npc_idle.png',text:'어서 오십시오. CLUB SINNER에 오신 것을 환영합니다.'},{image:'npc_welcome.png',text:'저는 1층 리셉션을 담당하는 안내 직원입니다. 방문해 주셔서 감사합니다.'},{image:'npc_guide.png',text:'1층은 메인 로비와 리셉션, 고객 대기 라운지로 구성되어 있습니다. 화면의 이동 지점을 눌러 둘러보실 수 있습니다.'},{image:'npc_guide.png',text:'2층은 프리미엄 라운지, 3층은 VIP 프라이빗룸, 4층은 VVIP 전용 공간입니다. 상단의 층·공간 메뉴에서 이동할 수 있습니다.'},{image:'npc_bye.png',text:'즐거운 시간 보내시길 바랍니다. 도움이 필요하시면 언제든 다시 저를 눌러주세요.'}];
function startNpc(){if(!scenes.length||scenes[current].floor!=='1F'){toast('리셉션 안내 직원은 1층에서 만나실 수 있습니다.');return}if($('intro').style.display!=='none')return;npcStep=0;showLine();$('dialog').classList.add('open');tone(680,.08)}function showLine(){const d=dialogues[npcStep];$('npcActor').src=d.image;$('npcActor').classList.add('visible');$('dialogText').textContent=d.text;$('nextDialogue').textContent=npcStep===dialogues.length-1?'안내 종료':'다음 ›'}function nextNpc(){if(npcStep<0)return;tone(650,.06);if(npcStep===dialogues.length-1){endNpc();return}npcStep++;showLine()}function endNpc(silent=false){$('dialog').classList.remove('open');npcStep=-1;$('npcActor').src='npc_idle.png';if(!silent)tone(500,.08)}
fetch('scenes.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('scenes.json '+r.status);return r.json()}).then(data=>{scenes=data.filter(s=>typeof s.image==='string').map(s=>({...s,image:s.image.replace(/^assets\//,'')}));loadScene(0);drawPanel()}).catch(e=>toast('장면 목록 로딩 오류: '+e.message));document.addEventListener('keydown',e=>{if(e.key==='Escape'){endNpc(true);closePanel()}else if($('dialog').classList.contains('open')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextNpc()}else if(!$('dialog').classList.contains('open')&&e.key==='ArrowRight')step(1);else if(!$('dialog').classList.contains('open')&&e.key==='ArrowLeft')step(-1)});
</script></body></html>
